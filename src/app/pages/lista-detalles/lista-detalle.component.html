<ion-header>
    <ion-toolbar>
        <ion-title>{{nombrelista}}</ion-title>
    </ion-toolbar>
</ion-header>
<ion-content>
    <div class="lista-libros">
        @if( data$ | async; as libros){
            @if(libros.length > 0) {
                @for (libro of libros; track $index) {
                @if (libro.titulo.toLowerCase().includes(busqueda.toLowerCase())) {
                    <app-card-info 
                    [libro]="libro" 
                    (accionLibro)="eliminar($event)" 
                    [botonTitulo]="'Eliminar'"
                    [icono]="'trash'"/>
                }
            }}
            @else {
                <div class="contenedor">
                    <p>Aún no existen libros agrega dando clic <ion-label [routerLink]="['/libros']" class="enlace">aquí</ion-label></p>
                </div>
            }
        }
    </div>
</ion-content>

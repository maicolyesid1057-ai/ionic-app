<ion-header>
    <ion-toolbar>
        <ion-title>Libros</ion-title>
    </ion-toolbar>
    <ion-searchbar [(ngModel)]="busqueda" placeholder="Buscar libro por título" />
</ion-header>
<ion-content>
    <div class="lista-libros">
        @if(data$ | async; as libros){
            @for (libro of libros; track $index) {
                @if (libro.titulo.toLowerCase().includes(busqueda.toLowerCase())) {
                    <app-card-info [libro]="libro"/>
                }
            }
        }
    </div>
</ion-content>

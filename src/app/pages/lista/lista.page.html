<ion-header>
  <ion-toolbar>
    <ion-title>
      Mis libros
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  @if (libros.length > 0) {

    @for (libro of libros; track libro.titulo) {

      <ion-card>

        <ion-img
          [src]="libro.caratula">
        </ion-img>

        <ion-card-header>

          <ion-card-title>
            {{ libro.titulo }}
          </ion-card-title>

        </ion-card-header>

        <ion-card-content>

          <p>
            Autor: {{ libro.autor }}
          </p>

          <p>
            Año: {{ libro.edicion }}
          </p>

          <p>
            {{ libro.descripcion }}
          </p>

        </ion-card-content>

      </ion-card>

    }

  } @else {

    <p style="text-align: center; padding: 20px;">
      No tienes libros guardados.
    </p>

  }

</ion-content>

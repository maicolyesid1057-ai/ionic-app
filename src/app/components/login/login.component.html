<ion-header>
  <ion-toolbar>
    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-label position="stacked">
      Correo
    </ion-label>

    <ion-input
      type="email"
      [(ngModel)]="correo"
      placeholder="Ingrese su correo">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">
      Contraseña
    </ion-label>

    <ion-input
      type="password"
      [(ngModel)]="password"
      placeholder="Ingrese su contraseña">
    </ion-input>
  </ion-item>

  <ion-button
    expand="block"
    (click)="iniciarSesion()">

    Iniciar sesión

  </ion-button>

  @if (mensaje) {
    <ion-text>
      <p>{{ mensaje }}</p>
    </ion-text>
  }

</ion-content>

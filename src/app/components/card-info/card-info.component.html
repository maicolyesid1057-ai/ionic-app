@if (libro() != undefined) {
  <ion-card
    class="libro-card"
    button="true"
    (click)="abrirDetalle()">
    <ion-img
      class="portada"
      [src]="libro()!.caratula">
    </ion-img>
    <ion-card-header>
      <ion-card-title>
        {{ libro()!.titulo }}
      </ion-card-title>
      <ion-card-subtitle>
        {{ libro()!.edicion }}
      </ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      Autor: {{ libro()!.autor }}
    </ion-card-content>
    <ion-button
      expand="block"
      (click)="$event.stopPropagation(); accion(libro()!)">
      <ion-icon [name]="icono()"></ion-icon>
      {{ botonTitulo() }}
    </ion-button>
  </ion-card>
}

@if(libro() != undefined){
  <ion-card class="libro-card">
    <ion-img class="portada" [src]="libro()!.caratula" />

    <ion-card-header>
      <ion-card-title>{{ libro()!.titulo }}</ion-card-title>
      <ion-card-subtitle>{{ libro()!.edicion }}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      Autor: {{ libro()!.autor }}
    </ion-card-content>

    <ion-button
      expand="block"
      (click)="$event.stopPropagation(); agregar(libro()!)">
      <ion-icon name="heart" /> {{botonTitulo()}}
    </ion-button>

  </ion-card>
}

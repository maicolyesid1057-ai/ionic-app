<ion-app>
  <ion-split-pane contentId="main-content" when="lg">
    @if (!esLogin) {
      <ion-menu
        contentId="main-content"
        menuId="main-menu"
        side="start"
        type="overlay">
        <ion-content>
          <div class="menu-container">
            <ion-list id="inbox-list">
              @for (p of appPages; track p) {
                <ion-menu-toggle auto-hide="true">
                  <ion-item
                    [routerLink]="[p.url]"
                    routerDirection="root"
                    lines="none"
                    detail="false"
                    routerLinkActive="selected">
                    <ion-icon
                      aria-hidden="true"
                      slot="start"
                      [ios]="p.icon + '-outline'"
                      [md]="p.icon + '-sharp'">
                    </ion-icon>
                    <ion-label>{{ p.title }}</ion-label>
                  </ion-item>
                </ion-menu-toggle>
              }
            </ion-list>
            <div class="logout-container">
              <ion-button
                expand="block"
                color="danger"
                fill="outline"
                (click)="cerrarSesion()">
                <ion-icon
                  name="log-out-outline"
                  slot="start">
                </ion-icon>
                Cerrar sesión
              </ion-button>
            </div>
          </div>
        </ion-content>
      </ion-menu>
    }
    <ion-router-outlet id="main-content">
    </ion-router-outlet>

  </ion-split-pane>

</ion-app>
